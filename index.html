<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tilt Veil — Legal &amp; Policies</title>
<meta name="description" content="Privacy Policy and Terms of Use for the Tilt Veil Android app, published by CauGiay Hotel.">
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1c2128; --muted:#5b6572;
    --accent:#2f6fed; --border:#e3e6ea;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171c; --card:#1b1f26; --text:#e8eaed; --muted:#98a1ad; --accent:#6ea2ff; --border:#2a2f38; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap{max-width:640px; margin:0 auto; padding:56px 20px 80px}
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(135deg, var(--accent), #7c5cff);
    color:#fff; font-size:24px; font-weight:700; margin-bottom:20px;
  }
  h1{font-size:1.7rem; margin:0 0 6px}
  .sub{color:var(--muted); margin:0 0 32px; font-size:.95rem}
  nav{display:flex; flex-direction:column; gap:12px}
  a.card{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px 18px; text-decoration:none; color:var(--text); font-weight:600;
    transition:border-color .15s ease;
  }
  a.card:hover{border-color:var(--accent)}
  a.card span.arrow{color:var(--muted); font-weight:400}
  footer{margin-top:48px; color:var(--muted); font-size:.85rem}
  footer a{color:var(--accent)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">TV</div>
    <h1>Tilt Veil — Legal &amp; Policies</h1>
    <p class="sub">Published by CauGiay Hotel</p>
    <nav>
      <a class="card" href="./privacy/">Privacy Policy <span class="arrow">&rarr;</span></a>
      <a class="card" href="./terms/">Terms of Use <span class="arrow">&rarr;</span></a>
    </nav>
    <footer>
      Questions? Contact <a href="mailto:cghotel1206@gmail.com">cghotel1206@gmail.com</a>
    </footer>
  </div>
</body>
</html>
